# Database connection properties — required via environment variables.
# No default password fallback: fail fast rather than boot with a well-known credential pair.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/recipes}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Hibernate properties
# show-sql is off by default (it floods production logs and can echo parameter values).
# Override with SPRING_JPA_SHOW_SQL=true locally, or enable the "dev" profile.
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}

# Docker Compose integration (disabled - we manage containers manually)
spring.docker.compose.enabled=false

# Actuator for health checks
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:never}
