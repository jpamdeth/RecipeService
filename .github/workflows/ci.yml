name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: recipebook

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Java
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          check-latest: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          cache-provider: basic

      - name: Pull MySQL test image
        run: docker pull mysql:8.0

      - name: Build and test
        run: ./gradlew build

      - name: Upload coverage report
        uses: actions/upload-artifact@v7.0.2
        with:
          name: jacoco-html-report
          path: recipebook/build/reports/jacoco/test/html
